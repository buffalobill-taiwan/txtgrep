services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${TXTGREP_DB_NAME:-txtgrep}
      POSTGRES_USER: ${TXTGREP_DB_USER:-txtgrep}
      POSTGRES_PASSWORD: ${TXTGREP_DB_PASSWORD:-txtgrep}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TXTGREP_DSN: pgsql:host=db;dbname=${TXTGREP_DB_NAME:-txtgrep}
      TXTGREP_DB_USER: ${TXTGREP_DB_USER:-txtgrep}
      TXTGREP_DB_PASSWORD: ${TXTGREP_DB_PASSWORD:-txtgrep}
      TXTGREP_CORPUS: txt
      TXTGREP_PATH_PREFIX: txt
      TXTGREP_LIMIT: ${TXTGREP_LIMIT:-500}
      TXTGREP_TIMEOUT_MS: ${TXTGREP_TIMEOUT_MS:-40000}
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "${TXTGREP_PORT:-8083}:8080"
    command: >
      sh -c "php bin/setup.php && php bin/index.php && php -S 0.0.0.0:8080 -t public"

volumes:
  pgdata:
